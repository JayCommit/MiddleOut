services:
  middleout:
    image: ghcr.io/jaycommit/middleout:0.2.0
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      ALLOW_SIGN_UP: ${ALLOW_SIGN_UP:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      MAX_OBJECT_BYTES: ${MAX_OBJECT_BYTES:-1073741824}
      ACCOUNT_QUOTA_BYTES: ${ACCOUNT_QUOTA_BYTES:-10737418240}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-3600}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - middleout-data:/app/data
    restart: unless-stopped
volumes:
  middleout-data:
